<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Developer blogs by Arumugam G — architecture, APIs, and systems." />
    <title>blog.arumugamg.com</title>
    <script>
      (function () {
        try {
          var isManual = localStorage.getItem("blog-theme-manual") === "true";
          var t = localStorage.getItem("blog-theme");
          if (!isManual || (t !== "light" && t !== "dark")) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
